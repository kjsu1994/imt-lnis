plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.lnis'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    testCompileOnly {
        extendsFrom testAnnotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'com.fazecast:jSerialComm:2.11.4'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    systemProperty 'lnis.native.candidate', providers.gradleProperty('nativeCandidate').orElse('native/bin/win-x64').get()
    systemProperty 'lnis.f9t.source', providers.gradleProperty('f9tExampleSource').orElse('').get()
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
    }
}

tasks.register('webTest') {
    group = 'verification'
    description = '브라우저 JavaScript 회귀시험을 실행한다.'
    doLast {
        [
                'src/test/js/http.smoke.mjs',
                'src/test/js/assets.smoke.mjs',
                'src/test/js/event-log.smoke.mjs',
                'src/test/js/frame-evidence-selection.smoke.mjs',
                'src/test/js/result-presentation.smoke.mjs',
                  'src/test/js/dtn-payload.smoke.mjs',
                  'src/test/js/dtn-log.smoke.mjs',
                'src/test/js/dtn-observations.smoke.mjs',
                'src/test/js/dtn-sender.smoke.mjs',
                'src/test/js/node-connection.smoke.mjs',
                'src/test/js/dtn-receiver.smoke.mjs'
        ].each { script ->
            providers.exec {
                commandLine 'node', script
            }.result.get().assertNormalExitValue()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('webTest')
}

tasks.named('bootJar') {
    archiveFileName = 'lnis.jar'
}

tasks.register('syntheticGraw', JavaExec) {
    group = 'verification'
    description = '실측이 아닌 지구 PVT 검증용 GRAW와 예상 결과를 생성한다.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'server.agent.codec.ExportSyntheticGraw'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'lnis.native.candidate', providers.gradleProperty('nativeCandidate').orElse('native/bin/win-x64').get()
}

// 운영 배포와 분리된 검증 묶음이다. Linux JVM에서 실제 SO와 Java 경계를 함께 시험한다.
tasks.register('linuxNativeVerificationZip', Zip) {
    group = 'verification'
    description = 'Linux SO의 JNA 및 DTN/PVT 회귀 검증용 묶음을 생성한다.'
    dependsOn tasks.named('testClasses')
    archiveFileName = 'linux-native-verification.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(sourceSets.main.output) { into 'classes' }
    from(sourceSets.test.output) { into 'classes' }
    from(configurations.testRuntimeClasspath) { into 'lib' }
    from('build/native-linux/libLnisAfsCodec.so') { into 'native' }
    doFirst {
        if (!file('build/native-linux/libLnisAfsCodec.so').isFile()) {
            throw new GradleException('먼저 native/build-linux.ps1로 Linux 후보 SO를 빌드하세요.')
        }
    }
}

// 독립 Linux 노드는 기존 Windows/중앙 서버 배포 작업과 명시적으로 분리한다.
tasks.register('nativeLinuxSourcesZip', Zip) {
    group = 'distribution'
    description = 'SO 재빌드 자료 및 LDPC 원본 라이선스를 함께 보관한다.'
    archiveFileName = 'native-sources.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    def nativeStage = providers.gradleProperty('linuxNativeStage')
    from(nativeStage.orElse('build/missing-native-stage')) {
        include '*.c', '*.h', 'build-linux.sh', 'rtk/**', 'pocketsdr/**', 'ldpc/**'
        exclude '**/.git/**'
    }
    from('native/THIRD-PARTY-NOTICES.txt')
    from('native/RTKLIB-README.txt')
    doFirst {
        if (!nativeStage.isPresent() || !file(nativeStage.get() + '/ldpc/COPYRIGHT').isFile()) {
            throw new GradleException('native/build-linux.ps1 출력의 Build staging 경로를 -PlinuxNativeStage=...로 지정하세요.')
        }
    }
}

tasks.register('linuxNodeDistZip', Zip) {
    group = 'distribution'
    description = '동일 이미지로 송신/수신 PC에서 실행할 Linux Compose 묶음을 생성한다.'
    dependsOn tasks.named('bootJar'), tasks.named('check'), tasks.named('nativeLinuxSourcesZip')
    archiveFileName = 'lnis-node-linux.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('deployment/node') {
        exclude 'docker-compose.dev.yml', 'dev-relay.mjs', 'docker-compose.example.yml'
    }
    from('build/iq') {
        into 'iq'
        include 'afs_sim', '008_Weil1500hex210prns.txt', 'LICENSE.txt', 'sources.zip'
    }
    from(tasks.named('bootJar').flatMap { it.archiveFile })
    from('build/native-linux/libLnisAfsCodec.so') { into 'native' }
    from(tasks.named('nativeLinuxSourcesZip').flatMap { it.archiveFile }) { into 'licenses' }
    from(['native/THIRD-PARTY-NOTICES.txt', 'native/RTKLIB-README.txt']) { into 'licenses' }
    from(providers.gradleProperty('linuxNativeStage').map { it + '/ldpc' }) {
        include 'COPYRIGHT', 'LGPL'
        into 'licenses/ldpc'
    }
    doFirst {
        if (!file('build/iq/afs_sim').isFile()) {
            throw new GradleException('먼저 native/build-iq.ps1로 I/Q 생성기를 빌드하세요.')
        }
        if (!file('build/native-linux/libLnisAfsCodec.so').isFile()) {
            throw new GradleException('먼저 native/build-linux.ps1로 Linux SO를 빌드하세요.')
        }
    }
}

tasks.register('agentDistZip', Zip) {
    dependsOn tasks.named('bootJar')
    archiveFileName = 'lnis-agent-windows.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(tasks.named('bootJar').flatMap { it.archiveFile }) {
        rename { 'lnis.jar' }
    }
    from('native/bin/win-x64') {
        into 'native'
    }
    from('native/THIRD-PARTY-NOTICES.txt')
    from('native/RTKLIB-README.txt')
    from('config') {
        into 'config'
    }
    from('deployment/agent')
    from('dist/windows-agent/runtime/jdk-21') {
        into 'runtime'
    }

    doFirst {
        if (!file('dist/windows-agent/runtime/jdk-21/bin/java.exe').isFile()) {
            throw new GradleException(
                    'Agent 전용 Java 21 runtime이 없습니다. 기존 runtime 설치 절차를 먼저 실행하세요.')
        }
    }
}

// 운영 폴더는 소스 저장소와 분리한다. -PlnisComposeDir=...로 다른 경로를 지정할 수 있다.
def lnisComposeDirectory = providers.gradleProperty('lnisComposeDir').orElse('C:/lnis-compose')

tasks.register('deployComposeBundle') {
    group = 'distribution'
    description = '실행에 필요한 파일만 C:/lnis-compose에 복사한다.'
    dependsOn tasks.named('bootJar')
    dependsOn tasks.named('agentDistZip')
    dependsOn tasks.named('check')

    doFirst {
        File existingCompose = new File(file(lnisComposeDirectory.get()), 'docker-compose.yml')
        if (existingCompose.isFile() && existingCompose.getText('UTF-8').contains('LNIS_NODE_ROLE:')) {
            throw new GradleException('대상 폴더는 독립 노드입니다. 중앙 서버 배포로 덮어쓰지 않습니다. linuxNodeDistZip 배포본을 사용하세요.')
        }
    }

    doLast {
        File target = file(lnisComposeDirectory.get())
        target.mkdirs()

        // Copy 대신 Gradle copy 작업을 명시적으로 사용해 기존 .env와 DB를 삭제하지 않는다.
        copy {
            from('deployment/compose')
            into(target)
        }
        copy {
            from(tasks.named('bootJar').flatMap { it.archiveFile })
            into(target)
            rename { 'lnis.jar' }
        }
        copy {
            from(tasks.named('agentDistZip').flatMap { it.archiveFile })
            into(new File(target, 'agent'))
        }
        new File(target, 'DB').mkdirs()
        File environment = new File(target, '.env')
        if (!environment.exists()) {
            copy {
                from('deployment/compose/.env.example')
                into(target)
                rename { '.env' }
            }
        }
        logger.lifecycle("LNIS 운영 배포본 갱신 완료: ${target.absolutePath}")
        logger.lifecycle('기존 .env와 DB 폴더는 유지했습니다.')
    }
}

// Build verifies artifacts only. Deployment is always an explicit task.

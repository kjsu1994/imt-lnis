name: lnis

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LNIS_AGENT_TOKENS: ${LNIS_AGENT_TOKENS:-sender-1=change-me-sender,receiver-1=change-me-receiver}
      LNIS_DB_URL: "jdbc:h2:file:/app/data/lnis"
      LNIS_DB_USERNAME: ${LNIS_DB_USERNAME:-sa}
      LNIS_DB_PASSWORD: ${LNIS_DB_PASSWORD:-}
      LNIS_DATA_DIR: /app/data
      LNIS_DTN_SEND_URL: ${LNIS_DTN_SEND_URL:-}
      LNIS_DTN_RECEIVE_URL: ${LNIS_DTN_RECEIVE_URL:-}
      LNIS_DTN_SEND_TOKEN: ${LNIS_DTN_SEND_TOKEN:-}
      LNIS_DTN_RECEIVE_TOKEN: ${LNIS_DTN_RECEIVE_TOKEN:-}
      LNIS_INCOMPLETE_RETENTION: ${LNIS_INCOMPLETE_RETENTION:-PT1H}
      LNIS_COMPLETED_RETENTION: ${LNIS_COMPLETED_RETENTION:-PT24H}
      LNIS_CLEANUP_DELAY: ${LNIS_CLEANUP_DELAY:-PT10M}
    volumes:
      - ./DB:/app/data
      # 잘못된 폴더에서 실행하면 새 DB가 생기는 대신 컨테이너 시작을 차단하는 안전장치다.
      - ./docker-compose.yml:/app/host-project/docker-compose.yml:ro
    ports:
      - "0.0.0.0:8088:8088"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/lnis/api/v1/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

name: lnis-node

services:
  # 최초 실행 시 DB 폴더 소유권만 준비하고 종료한다. 별도 Java/Agent 프로세스는 없다.
  init-db:
    image: lnis-node:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /app/data /exchange"]
    network_mode: none
    volumes:
      - ./DB:/app/data
      - ./exchange:/exchange
    restart: "no"

  node:
    image: lnis-node:local
    build: .
    depends_on:
      init-db:
        condition: service_completed_successfully
    ports:
      - "${LNIS_SERVER_PORT:-8088}:${LNIS_SERVER_PORT:-8088}"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul
      LNIS_HTTP_LOG_LEVEL: ${LNIS_HTTP_LOG_LEVEL:-INFO}
      LNIS_NODE_ROLE: ${LNIS_NODE_ROLE:?sender 또는 receiver를 설정하세요}
      SERVER_PORT: ${LNIS_SERVER_PORT:-8088}
      LNIS_NODE_BASE_URL: ${LNIS_NODE_BASE_URL:?현재 PC의 URL을 설정하세요}
      # 상대 PC 미설정 시 로컬 노드만 시작한다. 시험 실행 전 상대 주소를 설정해야 한다.
      LNIS_NODE_PEER_URL: ${LNIS_NODE_PEER_URL:-}
      LNIS_NODE_MANAGEMENT_TOKEN: ${LNIS_NODE_MANAGEMENT_TOKEN:?양쪽 관리 토큰을 설정하세요}
      LNIS_NATIVE_DIR: /app/native
      LNIS_DB_URL: jdbc:h2:file:/app/data/lnis
      LNIS_DB_PASSWORD: ${LNIS_DB_PASSWORD:-}
      LNIS_DATA_DIR: /app/data
      LNIS_IQ_ENABLED: ${LNIS_IQ_ENABLED:-false}
      LNIS_IQ_DIRECTORY: /exchange
      OMP_NUM_THREADS: "2"
      dtn_adapter: ${dtn_adapter:-}
      LNIS_DTN_SEND_TOKEN: ${LNIS_DTN_SEND_TOKEN:-}
      LNIS_DTN_RECEIVE_TOKEN: ${LNIS_DTN_RECEIVE_TOKEN:-}
    volumes:
      - ./DB:/app/data
      - ./exchange:/exchange
    tmpfs:
      # JNA 및 jSerialComm의 네이티브 라이브러리 로딩에 실행 가능한 임시 경로가 필요하다.
      - /tmp:rw,exec,nosuid,size=128m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${LNIS_SERVER_PORT:-8088}/lnis/api/v1/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

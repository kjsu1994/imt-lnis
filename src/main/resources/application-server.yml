server:
  port: 8088
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  datasource:
    url: ${LNIS_DB_URL:jdbc:h2:file:./data/lnis}
    username: ${LNIS_DB_USERNAME:sa}
    password: ${LNIS_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  servlet:
    multipart:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

lnis:
  dtn:
    send-url: ${dtn_adapter:${LNIS_DTN_SEND_URL:}}
    receive-url: ${dtn_adapter:${LNIS_DTN_RECEIVE_URL:${LNIS_DTN_SEND_URL:}}}
    send-token: ${LNIS_DTN_SEND_TOKEN:}
    receive-token: ${LNIS_DTN_RECEIVE_TOKEN:}
  agent-tokens: ${LNIS_AGENT_TOKENS:sender-1=change-me-sender,receiver-1=change-me-receiver}
  storage:
    data-directory: ${LNIS_DATA_DIR:./data}
    incomplete-retention: ${LNIS_INCOMPLETE_RETENTION:PT1H}
    completed-retention: ${LNIS_COMPLETED_RETENTION:PT24H}
    cleanup-delay: ${LNIS_CLEANUP_DELAY:PT10M}
